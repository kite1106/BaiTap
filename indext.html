<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaiTap</title>
    <style>
        :root {
            --primary: #f5a623;
            --bg: #1a1a2e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #e0e0e0;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #16213e, #1a1a2e);
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-8px);
            }

            40%,
            80% {
                transform: translateX(8px);
            }
        }

        .container h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 32px;
            text-align: center;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: #a0b4cc;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 4px rgba(245, 166, 35, 0.15);
        }

        .error-msg {
            display: none;
            color: #ff6b6b;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 16px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .btn-push {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f5a623, #ff8c00);
            border: none;
            border-radius: 12px;
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(245, 166, 35, 0.3);
            margin-top: 8px;
        }

        .btn-push:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(245, 166, 35, 0.4);
            filter: brightness(1.1);
        }

        .btn-push:active {
            transform: translateY(0);
        }

        .shake {
            animation: shake 0.4s ease;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>🔐 Đăng Nhập</h2>

        <div class="form-group">
            <label for="textboxUserName">UserName</label>
            <input type="text" id="textboxUserName" placeholder="Nhập tên đăng nhập..." autocomplete="username">
        </div>

        <div class="form-group">
            <label for="textboxPassword">Password</label>
            <input type="password" id="textboxPassword" placeholder="Nhập mật khẩu..." autocomplete="current-password">
        </div>

        <div class="error-msg" id="errorMsg">❌ Tên đăng nhập hoặc mật khẩu không đúng!</div>

        <button class="btn-push" id="btnLogin" onclick="handleLogin()">Đăng nhập</button>
    </div>

    <script>
        function handleLogin() {
            const username = document.getElementById('textboxUserName').value.trim();
            const password = document.getElementById('textboxPassword').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const container = document.querySelector('.container');

            if (username === 'admin' && password === 'admin') {
                errorMsg.style.display = 'none';
                document.getElementById('btnLogin').textContent = '✅ Thành công!';
                setTimeout(() => {
                    window.location.href = 'success.html';
                }, 600);
            } else {
                errorMsg.style.display = 'block';
                container.classList.remove('shake');
                void container.offsetWidth; // trigger reflow
                container.classList.add('shake');
            }
        }

        // Allow pressing Enter to login
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') handleLogin();
        });
    </script>

</body>

</html>
