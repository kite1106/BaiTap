<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập thành công</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #16213e, #1a1a2e);
            font-family: 'Inter', -apple-system, sans-serif;
            color: #e0e0e0;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 60px 50px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .icon {
            font-size: 5rem;
            margin-bottom: 24px;
            animation: bounce 1s ease infinite alternate;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        p {
            color: #a0b4cc;
            font-size: 1rem;
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(245, 166, 35, 0.15);
            border: 1px solid rgba(245, 166, 35, 0.4);
            border-radius: 999px;
            color: #f5a623;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 36px;
            letter-spacing: 0.5px;
        }

        .btn-back {
            display: inline-block;
            padding: 13px 32px;
            background: linear-gradient(135deg, #f5a623, #ff8c00);
            border: none;
            border-radius: 12px;
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(245, 166, 35, 0.3);
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(245, 166, 35, 0.4);
            filter: brightness(1.1);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">🎉</div>
        <h1>Đăng Nhập Thành Công!</h1>
        <p>Chào mừng bạn trở lại.<br>Bạn đã đăng nhập với tài khoản <strong>admin</strong>.</p>
        <div class="badge">✅ Xác thực thành công</div>
        <br>
        <a href="indext.html" class="btn-back">← Quay lại đăng nhập</a>
    </div>
</body>

</html>
